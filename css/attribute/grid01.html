<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .sub_box {
            border: 1px solid black;
        }

        .main_box {
            display: grid;
            grid-template-rows: 70px 70px;
            grid-template-columns: 100px 100px 100px;
            /* 2행 3열 */

            row-gap: 5px;
            column-gap: 5px;
            /* 행 열 띄기 */
        }

        .row-merge { /* 행 합치기 */
            /* grid-row-start: 1;
            grid-row-end: 3; */
            grid-row: 1 / span 2;
        }

        .col-merge {
            /* grid-column-start: 2;
            grid-column-end: 4; */
            grid-column: 2 / 4;
        }
    </style>

</head>
<body>
    <div class="main_box">
        <div class="sub_box row-merge"></div>
        <div class="sub_box col-merge"></div>
        <div class="sub_box"></div>
        <div class="sub_box"></div>
        <!-- <div class="sub_box"></div> -->
        <!-- <div class="sub_box"></div> -->
    </div>
</body>
</html>
