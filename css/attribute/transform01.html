<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            width: 100px;
            height: 100px;
            background-color: lightblue;

            /* transform: translate(50px, 150px); x 축으로 50px 이동 y 축으로 150px 이동 */
            /* transform: translateX(250px); x 축으로 250px 이동 */
            /* transform: scale(1.5, 2.5) x 축 0.7배 y축 1.8배 */
            /* transform: scaleY(2); */
            /* transform: skew(30deg, 45deg); skew : x 30도 꺽기, y축 45도 꺽기 */
            transform: rotate(135deg); /* rotate : 45도만큼 회전 */
            transform-origin: right bottom; /* 기준점 설정 */
        }
    </style>
</head>
<body>
    <div class="box"></div>
</body>
</html>
