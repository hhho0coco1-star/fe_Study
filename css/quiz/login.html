<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* -------------- main_box -------------- */
        .main_box {
            width: 500px;
            height: 600px;
            background-color: darkolivegreen;
            border: 1px solid black;
            opacity: 0.5;

            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        /* -------------- header -------------- */
        .header {
            width: 100%;
            height: 18%;
            /* background-color: white; */

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .header2 {
            width: 100%;
            height: 18%;
            /* background-color: white; */
            color: white;
            font-size: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .header_signup {
            width: 45%;
            height: 40%;

            color: white;
            background-color: gray;
            text-align: center;
            align-content: center;
        }

        .header a {
            text-decoration: none;
            color: white;
        }

        .header_login {
            width: 45%;
            height: 40%;

            color: white;
            background-color: green;
            text-align: center;
            align-content: center;
        }

        /* -------------- form_box -------------- */
        .form_box {
            width: 100%;
            height: 48%;
            /* background-color: white; */

            text-align: center;
            /* align-content: center; */
            /* display: flex; */
            /* flex-wrap: wrap; */
        }

        input {
            width: 90%;
            height: 14%;
            font-size: 18px;
            opacity: 1;
            background-color: darkolivegreen;
            border: 1px solid white;

        }

        /* -------------- footer -------------- */
        .footer {
            width: 100%;
            height: 16%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .footer1 {
            width: 90%;
            height: 60px;
            background-color: green;
            color: white;

            font-size: 20px;
            font-weight: 1000;
            text-align: center;
            align-content: center;
        }

         /* -------------- 기능 -------------- */
        .header_signup:hover {
            background-color: green;
        }
        .footer a, .header a {
            text-decoration: none;
            color: white;
        }
    </style>
</head>

<body>
    <div class="main_box">
        <div class="header">
            <div class="header_signup"><a href="singup.html">Sign Up</a></div>
            <div class="header_login">Log In</div>
        </div>
        <div class="header2">Welcome Back!</div>

        <form class="form_box">
            <br><br>
            <input class="form_box1" type="text" placeholder=" Email Address *">
            <br><br><br>
            <input class="form_box1" type="password" placeholder=" Password *">
        </form>
        <div class="footer">
            <button class="footer1"><a href="main.html">Log In</a></button>
        </div>
    </div>


</body>

</html>
