<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* -------------- main_box -------------- */
        .main_box {
            width: 100%;
            height: 100%;
            background-color: darkolivegreen;
            border: 1px solid black;
            opacity: 0.5;

            display: flex;
            justify-content: center;
            align-items: center;

            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        /* -------------- header -------------- */
        .header {
            width: 40%;
            height: 10%;
            background-color: greenyellow;
            font-size: 20px;
            color: white;

            text-align: center;
            align-content: center;

            /* display: none; */
            opacity: 0;

            animation-name: box-ani1;
            animation-duration: 3s; /* 응답 시간 */
            /* animation-delay: 2s; 대기 시간 */
            animation-fill-mode: forwards; /* forwards : 실행 후 상태를 적용 end */
            /* animation-iteration-count: infinite; 반복 무제한 */
            animation-direction: alternate; 
            animation-play-state: running;
            /* background-color: white; */
        }

        @keyframes box-ani1 {
            0% {
                opacity: 0;
            }
            50% {
                opacity: 0.5;
            }
            100% {
                opacity: 1;
            }
        }
    </style>
</head>

<body>
    <div class="main_box">
        <div class="header">Welcome to Webpage!</div>
    </div>


</body>

</html>
