<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            width: 100px;
            height: 100px;
            border: 1px solid black;

            animation-name: ani_box;
            animation-duration: 2s;
            animation-iteration-count: infinite; /* 무제한 반복 */
            animation-direction: alternate;
            
            /* position: relative; */
        }

        @keyframes ani_box {
            0% {
                background-color: blue;
                /* left: 0px; */
                transform: translateX(0px) translateY(0px) rotate(0deg);
                /* transform: rotate(0deg); */
            }
            25% {
                background-color: orange;
                /* left: 300px; */
                /* transform: rotate(360deg); */
                transform: translateX(300px) translateY(300px) rotate(360deg);
            }
            50% {
                background-color: pink;
                /* left: 600px; */
                /* transform: rotate(720deg); */
                transform: translateX(600px) translateY(600px) rotate(720deg) 
            }
            75% {
                background-color: orange;
                /* left: 300px; */
                /* transform: rotate(360deg); */
                transform: translateX(900px) translateY(300px) rotate(360deg);
            }
            100% {
                background-color: pink;
                /* left: 600px; */
                /* transform: rotate(720deg); */
                transform: translateX(1200px) translateY(0px) rotate(720deg) 
            }
        }
    </style>
</head>
<body>
    <div class="box">1</div>
</body>
</html>
