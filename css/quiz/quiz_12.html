<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        /* ------------- 기본 세팅 ------------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ------------- text_center ------------- */
        .text_center {
            text-align: center; 
            align-content: center; 
        }

        /* ------------- 헤더 영역 ------------- */
        .main_box {
            width: 700px;
            height: 500px;
            margin: 0 auto;
            border: 1px solid black;
            margin-top: 50px;

            /* position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%); */
        }

        /* ------------- sub_box1 ------------- */
        .sub_box1 {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
        }

        .sub_box11 {
            width: 200px;
            height: 100px;
            background-color: lightcoral;
            color: white;
        }

        .sub_box12 {
            width: 100px;
            height: 100px;
            text-align: center;
            background-color: lightcoral;
            color: white;
        }

        /* ------------- sub_box2 ------------- */
        .sub_box2 {
            display: flex;
        }
        .sub_box21 {
            width: 490px;
            height: 300px;
            background-color: lightsalmon;
            color: white;
            
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            justify-content: space-evenly;
            align-items: center;
        }

        .sub_box22 {
            width: 210px;
            height: 300px;
            background-color: lightgreen;
            color: white;
            text-align: center;
            align-content: center;
        }

        .sub_box222 {
            width: 100px;
            height: 50px;
            background-color: lightslategray;
            margin: 20px;

            transition-property: all;
            transition-duration: 2s;
        }

        .sub_box222:hover {
            /* width: 120px;
            height: 60px; */

            transform: scale(1.5);
            /* 원형의 1.5배 커짐 */
        }

        /* ------------- sub_box3 ------------- */
        .sub_box3 {
            /* display: flex; */
            width: 700px;
            height: 100px;
            background-color: lightskyblue;
            color: white;
        }
    </style>
</head>
<body>
    <div class="main_box">
        <div class="sub_box1">
            <div class="sub_box11 text_center">메인메뉴</div>
            <div class="sub_box12 text_center">마이페이지</div>
        </div>
        <div class="sub_box2">
            <div class="sub_box21">
                <div class="sub_box222 text_center">1</div>
                <div class="sub_box222 text_center">2</div>
                <div class="sub_box222 text_center">3</div>
                <div class="sub_box222 text_center">4</div>
                <div class="sub_box222 text_center">5</div>
                <div class="sub_box222 text_center">6</div>
            </div>
            <div class="sub_box22 text_center">aisde</div>
        </div>
        <div class="sub_box3 text_center">footer</div>
    </div>
</body>
</html>
