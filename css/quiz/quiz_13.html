<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* -------------- 기본 -------------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .text_center {
            text-align: center;
            align-content: center;
        }
        /* -------------- main_box -------------- */
        .main_box {
            width: 800px;
            /* height: 750px; */
            border: 1px solid black;
            margin: 10px;
            /* display: flex; */
            
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        /* -------------- header -------------- */
        .header {
            display: flex;
        }
        .header_box1 {
            width: 400px;
            height: 150px;
            border: 1px solid black;
            background-color: lightgoldenrodyellow;
        }
        .header_box2 {
            width: 400px;
            height: 150px;
            border: 1px solid black;
            background-color: lightgray;
        }
        .header_box3 {
            width: 800px;
            height: 150px;
            border: 1px solid black;
            background-color: lightcoral;
        }

        /* -------------- body -------------- */
        .body {
            display: flex;
        }
        .body_box1 {
            width: 300px;
            height: 300px;
            border:1px solid black;
            background-color: lightblue;
        }
        .body_box2 {
            width: 500px;
            height: 150px;
            border:1px solid black;
            background-color: lightgoldenrodyellow;
        }
        .body_box3 {
            width: 500px;
            height: 150px;
            border:1px solid black;
            background-color: lightpink;
        }

        /* -------------- footer -------------- */
        .footer {
            display: flex;
        }
        .footer1 {
            display: flex;
            width: 50%;
        }
        .footer2 {
            display: flex;
            width: 50%;
        }
        .footer_box1 {
            width: 200px;
            height: 150px;
            border: 1px solid black;
            background-color: lightgoldenrodyellow;
        }
        .footer_box2 {
            width: 200px;
            height: 150px;
            border: 1px solid black;
            background-color: yellow;
        }
        .footer_box3 {
            width: 200px;
            height: 150px;
            border: 1px solid black;
            background-color: lightgoldenrodyellow;
        }
        .footer_box4 {
            width: 200px;
            height: 150px;
            border: 1px solid black;
            background-color: lightgreen;
        }

        /* -------------- media -------------- */
        /* -------------- media(700) -------------- */
        @media screen and (max-width: 700px) {
            .main_box {width: 100%;}
        }

        /* -------------- media(600) -------------- */
        @media screen and (max-width: 650px) {
            /* .main_box {width: 100%;} */
            .footer {
                width: 100%;
                flex-direction: column;
                flex-wrap: wrap;
            }
            .footer1 {
                width: 100%;
            }
            .footer2 {
                width: 100%;
            }
            .footer_box1 {
                width: 50%
            }
            .footer_box2 {
                width: 50%
            }
            .footer_box3 {
                width: 50%
            }
            .footer_box4 {
                width: 50%
            }
        }

        /* -------------- media(500) -------------- */
        @media screen and (max-width: 500px) {
            .main_box {width: 100%;}
            
        }
    </style>
</head>
<body>
    <div class="main_box">
        <div class="header">
            <div class="header_box1 text_center">1</div>
            <div class="header_box2 text_center">2</div>
        </div>
        <div class="header_box3 text_center">3</div>

        <div class="body">
            <div class="body_box1 text_center">4</div>
            <div class="body2">
                <div class="body_box2 text_center">5</div>
                <div class="body_box3 text_center">6</div>
            </div>
        </div>

        <div class="footer">
            <div class="footer1">
                <div class="footer_box1 text_center">7</div>
                <div class="footer_box2 text_center">8</div>
            </div>
            <div class="footer2">
                <div class="footer_box3 text_center">9</div>
                <div class="footer_box4 text_center">10</div>
            </div>
            
        </div>
    </div>
</body>
</html>
